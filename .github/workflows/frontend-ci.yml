name: Frontend CI

on:
  pull_request:
    branches:
      - dev
      - qa
      - main

defaults:
  run:
    working-directory: chatbot_admin

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chatbot_admin/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Ejecutar pruebas unitarias
        run: npm run test

      - name: Compilar proyecto
        run: npm run build